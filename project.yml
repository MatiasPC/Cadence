name: Cadence
options:
  bundleIdPrefix: com.cadence
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  DesignSystem:
    url: https://github.com/MatiasPC/velvet-ui.git
    branch: main

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "2.3"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.cadence.app
    GENERATE_INFOPLIST_FILE: "NO"
    INFOPLIST_FILE: Cadence/Resources/Info.plist
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    # Signing is deliberately NOT set here — build settings in this block would
    # override the xcconfig below. See Cadence/Config/Signing.xcconfig for why a
    # stable signature matters to Keychain access.
    PRODUCT_NAME: Cadence
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
  configs:
    Release:
      # Xcode injects com.apple.security.get-task-allow — the entitlement that
      # lets a debugger attach — into every build by default. Apple rejects
      # notarization outright when it's present ("The executable requests the
      # com.apple.security.get-task-allow entitlement"), and a Release build
      # has no business being debuggable anyway. Debug keeps it.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"

configFiles:
  Debug: Cadence/Config/Signing.xcconfig
  Release: Cadence/Config/Signing.xcconfig

targets:
  Cadence:
    type: application
    platform: macOS
    sources:
      - path: Cadence
        excludes:
          - "Config/*.xcconfig"
    dependencies:
      - package: DesignSystem
    settings:
      base:
        INFOPLIST_FILE: Cadence/Resources/Info.plist
